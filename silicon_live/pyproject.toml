[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-live"
version = "0.1.0"
description = "Evidence-first LeanSilicon Textual dashboard"
requires-python = ">=3.10"
dependencies = ["textual>=0.79,<2", "rich>=13.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
