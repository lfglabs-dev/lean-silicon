name: CI

on:
  # Feature-branch commits are checked by pull_request. Limiting push to the
  # default branch prevents two identical deep-formal runs for the same SHA.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  executable-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Provenance validates a documented ancestor, not just the checkout.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python, analytical counts, and structural checks
        run: make check
      - name: Record FPGA detection ladder (no board attached; reporting only)
        run: make fpga-detect

  systemverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Checkout clean detached frozen upstream oracle
        run: >-
          git clone https://github.com/leanEthereum/leanVM-b.git /tmp/leanVM-b &&
          git -C /tmp/leanVM-b checkout --detach c308034ab78619b39a59d26f3dc60e7df5b52649 &&
          test -z "$(git -C /tmp/leanVM-b status --porcelain --untracked-files=all)" &&
          test -z "$(git -C /tmp/leanVM-b symbolic-ref -q HEAD)"
      - name: Install pinned Rust for locked frozen-oracle probe
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Compile and simulate RTL
        run: LEANVM_B_UPSTREAM=/tmp/leanVM-b make sim m2-differential conformance-differential

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Elan with transient-download retries
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 30 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 600 \
            --output elan-init.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" elan-init.tar.gz | sha256sum --check --status
          tar -xzf elan-init.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Icarus Verilog for the authored RTL contract
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Build Lean workspace
        run: cd lean && lake build
      - name: Explicit Lean library target
        run: cd lean && lake build LeanVMBMinCore
      - name: Full-profile semantic mutation sensitivity
        run: cd lean && python3 check_full_profile_mutations.py
      - name: Accepted DEREF premise-binding mutation sensitivity
        run: cd lean && python3 check_accepted_deref_binding_mutations.py
      - name: Accepted JUMP premise-binding mutation sensitivity
        run: cd lean && python3 check_accepted_jump_binding_mutations.py
      - name: Accepted scalar premise-binding mutation sensitivity
        run: cd lean && python3 check_accepted_scalar_binding_mutations.py
      - name: Arbitrary mixed-sequence mutation sensitivity
        run: cd lean && python3 check_accepted_sequence_mutations.py
      - name: Lean/authored RTL observable contract
        run: make lsc1-authored-rtl-contract
      - name: LSC1-05 v2 adversarial regressions (defect classes from PR #73)
        run: python3 test/test_lsc1_05_v2_adversarial_regressions.py -v
      - name: Host-prepared memory/fetch boundary
        run: make lsc1-host-authored-rtl-boundary
      - name: Host-prepared corrupted RETIRE discard boundary
        run: make lsc1-retire-mismatch-host-boundary
      - name: Host-prepared corrupted RETIRE transaction-id discard boundary
        run: make lsc1-retire-txn-mismatch-host-boundary
      - name: Bounded BLAKE3 SERVICE_PENDING STATUS differential
        run: make lsc1-blake3-status-host-boundary
      - name: Bounded BLAKE3 STATUS transaction-id mutation sensitivity
        run: make lsc1-blake3-status-host-boundary-mutation

  formal-toolchain:
    runs-on: ubuntu-latest
    # curl may spend 1800s in its retry window, then 900s in the request that
    # crossed that boundary; retain 15 minutes for verification and extraction.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Verify formal tool entry points
        run: yosys -V && sby --version

  formal-and-lint:
    needs: formal-toolchain
    runs-on: ubuntu-latest
    # Solver regressions must terminate as an actionable failed check instead
    # of consuming the platform's six-hour default and encouraging rerun loops.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The release-equivalence lane reads its frozen RTL from SOURCE_SHA.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned assurance schema dependency
        run: python -m pip install jsonschema==4.25.1
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Bounded GF(2^8) proof
        run: cd formal && sby -f gf8_mul.sby
      - name: WIDTH=128 byte-serialization order proof
        run: cd formal && sby -f gf128_serialize.sby
      - name: Bound checker is elaborated inside the shipped stream ALU
        # The built-in Yosys frontend silently drops `bind`, which would make
        # the next step a vacuous pass.  Fail loudly if no checker cell exists.
        # Pre-flight report only: the authoritative gate is the same
        # `select -assert-min` assertion inside stream_alu_mul_pulse.sby, which
        # ties the check to the run that actually produces the proof.
        run: >-
          cd formal && yosys -p 'plugin -i slang;
          read_slang --top stream_alu_mul_pulse_formal --keep-hierarchy
          ../asic_core/rtl/gf2n_mul_bitstream.sv ../asic_core/rtl/gf128_mul_bitstream.sv
          ../asic_core/rtl/leanvm_b_stream_alu.sv stream_alu_mul_pulse_formal.sv;
          prep -top stream_alu_mul_pulse_formal;
          select -assert-min 4 leanvm_b_mul_pulse_check*/t:$check'
      - name: Multiplier pulse mutual-exclusion proof on shipped RTL
        run: cd formal && sby -f stream_alu_mul_pulse.sby
      - name: LSC-1u protocol and retained-boundary proofs
        run: cd formal && sby -f lsc1u_protocol.sby
      - name: LSC-1u retained-operation reachability
        run: cd formal && sby -f lsc1u_reachability.sby
      - name: LSC-1u XOR retained-boundary refinement
        run: cd formal && sby -f lsc1u_xor_refinement.sby
      - name: GF(2^128) accepted-stream refinement
        run: cd formal && sby -f gf128_mul_stream_refinement.sby
      - name: Formal subprocess-tree timeout regression
        run: python3 -m unittest formal/test_subprocess_tree.py -v
      - name: LSC-1u compositional all-operation refinement
        run: cd formal && sby -f lsc1u_compositional_refinement.sby
      - name: Tiny Tapeout wrapper/core composition proof
        run: cd formal && sby -f lsc1u_wrapper_composition.sby
      - name: Fixed release netlist versus RTL bounded equivalence
        run: cd formal && sby -f lsc1u_netlist_eq.sby short
      - name: Pinned v0.1.1 physical netlist sequential equivalence lane
        env:
          LSC1_EQ_CACHE: ${{ runner.temp }}/lsc1-eq-cache
        run: make release-netlist-equivalence
      - name: Mutation sensitivity of retained safety and arithmetic properties
        run: make formal-mutations
      - name: Yosys lint and synthesis
        run: >-
          yosys -p 'read_verilog -sv asic_core/rtl/gf2n_mul_bitstream.sv asic_core/rtl/gf128_mul_bitstream.sv asic_core/rtl/leanvm_b_stream_alu.sv
          asic_core/rtl/lsc1_packet_rx.sv asic_core/rtl/lsc1_packet_tx.sv asic_core/rtl/lsc1_stream_adapter.sv
          asic_core/rtl/lsc1_field_encoder.sv asic_core/rtl/lsc1_blake3_lifecycle.sv asic_core/rtl/lsc1_response_payload_mux.sv asic_core/rtl/lsc1_blake3_alias_check.sv asic_core/rtl/lsc1_request_validator.sv asic_core/rtl/lsc1_cell_alias_check.sv asic_core/rtl/lsc1_packet_frontend.sv asic_core/rtl/lean_silicon_lsc1.sv;
          hierarchy -check -top lean_silicon_lsc1; proc; check; synth -top lean_silicon_lsc1; stat'
      - name: LSC-1 full-profile bounded assurance (non-release lane)
        env:
          LSC1_FULL_CACHE: ${{ runner.temp }}/lsc1-full-profile
        run: make full-profile-assurance
      - name: M2 controller lint and synthesis
        run: >-
          yosys -p 'read_verilog -sv src/leanvm_b_m2_scalar_controller.sv;
          synth -top leanvm_b_m2_scalar_controller; stat'

  deref-lifecycle:
    needs: formal-toolchain
    name: deref-lifecycle (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        task:
          - safety
          - reachability
          - accepted_result_reachability
          - matching_retire_reachability
          - accepted_result_safety
          - matching_retire_safety
          - post_retire_safety
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Check one canonical DEREF lifecycle sub-goal
        run: python3 formal/run_deref_bridge_tasks.py --task "${{ matrix.task }}"

  deref-lifecycle-mutations:
    needs: formal-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Reject below-bound and critical DEREF-to-RETIRE mutations
        run: make formal-deref-coverage-mutation

  jump-lifecycle:
    needs: formal-toolchain
    name: jump-lifecycle (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - safety
          - reachability
          - accepted_result_reachability
          - matching_retire_reachability
          - accepted_result_safety
          - matching_retire_safety
          - post_retire_safety
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Check one canonical JUMP lifecycle sub-goal
        run: python3 formal/run_jump_bridge_tasks.py --task "${{ matrix.task }}"

  jump-lifecycle-mutations:
    needs: formal-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Reject below-bound and critical JUMP-to-RETIRE mutations
        run: make formal-jump-coverage-mutation

  scalar-lifecycle:
    needs: formal-toolchain
    name: scalar-lifecycle (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - set_accepted_result_reachability
          - set_accepted_result_safety
          - set_matching_retire_reachability
          - set_matching_retire_safety
          - set_post_retire_reachability
          - set_post_retire_safety
          - xor_accepted_result_reachability
          - xor_accepted_result_safety
          - xor_matching_retire_reachability
          - xor_matching_retire_safety
          - xor_post_retire_reachability
          - xor_post_retire_safety
          - mul_accepted_result_reachability
          - mul_accepted_result_safety
          - mul_matching_retire_reachability
          - mul_matching_retire_safety
          - mul_post_retire_reachability
          - mul_post_retire_safety
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Check one scalar lifecycle sub-goal
        run: python3 formal/run_scalar_lifecycle_tasks.py --task "${{ matrix.task }}"

  scalar-lifecycle-mutations:
    needs: formal-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Reject critical scalar lifecycle mutations
        run: make formal-scalar-mutations

  full-lsc1-netlist:
    needs: formal-toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Full LSC-1 generic netlist synthesis and formal correspondence
        env:
          LSC1_FULL_NETLIST_CACHE: ${{ runner.temp }}/full-lsc1-netlist
        run: make full-lsc1-netlist-assurance
