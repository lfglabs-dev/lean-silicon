name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  executable-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python, analytical counts, and structural checks
        run: make check

  systemverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and simulate RTL
        run: make sim

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          nanoda: true
          nanoda-allow-sorry: false

  formal-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
      - name: Bounded GF(2^8) proof
        run: cd formal && sby -f gf8_mul.sby
      - name: Yosys lint and synthesis
        run: >-
          yosys -p 'read_verilog -sv src/gf2n_mul_bitstream.sv src/gf128_mul_bitstream.sv src/leanvm_b_stream_alu.sv src/tt_um_leanvm_b_mincore.sv;
          hierarchy -check -top tt_um_leanvm_b_mincore; proc; check; synth -top tt_um_leanvm_b_mincore; stat'
