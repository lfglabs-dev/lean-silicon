name: Setup pinned OSS CAD Suite
description: Restore or boundedly acquire and verify the pinned formal toolchain

runs:
  using: composite
  steps:
    - name: Restore immutable OSS CAD Suite archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/oss-cad-suite-linux-x64-20260809.tgz
        key: oss-cad-suite-linux-x64-20260809-7c0f1bb619d03fdf

    - name: Verify or boundedly acquire OSS CAD Suite
      shell: bash
      env:
        ARCHIVE: ${{ runner.tool_cache }}/oss-cad-suite-linux-x64-20260809.tgz
        MANIFEST: ${{ github.workspace }}/.github/toolchains/oss-cad-suite-20260809.json
        SUITE_DIR: ${{ runner.temp }}/oss-cad-suite
      run: |
        set -euo pipefail
        readarray -t pinned < <(python3 - "$MANIFEST" <<'PY'
        import json, sys
        m = json.load(open(sys.argv[1], encoding="utf-8"))
        print(m["archive_bytes"])
        print(m["archive_sha256"])
        print(m["archive_url"])
        print(m["yosys_relative_path"])
        print(m["yosys_sha256"])
        PY
        )
        EXPECTED_BYTES="${pinned[0]}"
        EXPECTED_SHA256="${pinned[1]}"
        OSS_CAD_SUITE_URL="${pinned[2]}"
        YOSYS_RELATIVE_PATH="${pinned[3]}"
        YOSYS_SHA256="${pinned[4]}"
        mkdir -p "$(dirname "$ARCHIVE")"

        archive_is_valid() {
          test -f "$ARCHIVE" &&
            test "$(stat -c %s "$ARCHIVE")" = "$EXPECTED_BYTES" &&
            printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --status
        }

        if ! archive_is_valid; then
          rm -f "$ARCHIVE"
          partial="${ARCHIVE}.partial"
          rm -f "$partial"
          echo "OSS CAD Suite cache miss or integrity failure; acquiring pinned archive"
          if ! curl --fail --location --show-error \
            --connect-timeout 30 --max-time 900 \
            --retry 4 --retry-all-errors --retry-delay 10 --retry-max-time 1800 \
            --output "$partial" "$OSS_CAD_SUITE_URL"; then
            rm -f "$partial"
            echo "OSS CAD Suite acquisition exhausted bounded retries" >&2
            exit 1
          fi
          mv "$partial" "$ARCHIVE"
        fi

        actual_bytes="$(stat -c %s "$ARCHIVE")"
        actual_sha256="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
        if test "$actual_bytes" != "$EXPECTED_BYTES" || test "$actual_sha256" != "$EXPECTED_SHA256"; then
          echo "OSS CAD Suite integrity failure: bytes=$actual_bytes sha256=$actual_sha256" >&2
          exit 1
        fi

        rm -rf "$SUITE_DIR"
        mkdir -p "$SUITE_DIR"
        tar -xzf "$ARCHIVE" --strip-components=1 -C "$SUITE_DIR"
        test -x "$SUITE_DIR/$YOSYS_RELATIVE_PATH"
        printf '%s  %s\n' "$YOSYS_SHA256" "$SUITE_DIR/$YOSYS_RELATIVE_PATH" | sha256sum --check --status
        test -x "$SUITE_DIR/bin/sby"
        printf '%s\n' "$SUITE_DIR/bin" >> "$GITHUB_PATH"
        printf 'OSS_CAD_SUITE_ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"
