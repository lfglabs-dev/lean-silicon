# Tiny Tapeout project information
project:
  title:        "leanSilicon LSC-1 byte lane"
  author:       "LFG Labs"
  discord:      ""
  description:  "Experimental packetized leanVM-b scalar coprocessor byte lane; physical validation pending."
  language:     "SystemVerilog"
  clock_hz:     25000000
  # Conservative initial candidate from the repository design-space study.
  # No routed tile-fit claim is made until the ttsky26c GDS job succeeds.
  tiles:        "2x2"
  top_module:   "tt_um_lfglabs_lean_silicon_lsc1"
  # Paths are relative to src/. The ../asic_core paths deliberately compile the
  # canonical handwritten boundary in place rather than copying it into src/.
  source_files:
    - "tt_um_lfglabs_lean_silicon_lsc1.sv"
    - "../asic_core/rtl/gf2n_mul_bitstream.sv"
    - "../asic_core/rtl/gf128_mul_bitstream.sv"
    - "../asic_core/rtl/leanvm_b_stream_alu.sv"
    - "../asic_core/rtl/lsc1_stream_adapter.sv"
    - "../asic_core/rtl/lsc1_packet_rx.sv"
    - "../asic_core/rtl/lsc1_packet_tx.sv"
    - "../asic_core/rtl/lsc1_packet_frontend.sv"
    - "../asic_core/rtl/lsc1_field_encoder.sv"
    - "../asic_core/rtl/lean_silicon_lsc1.sv"

pinout:
  ui[0]: "REQUEST_BYTE[0]"
  ui[1]: "REQUEST_BYTE[1]"
  ui[2]: "REQUEST_BYTE[2]"
  ui[3]: "REQUEST_BYTE[3]"
  ui[4]: "REQUEST_BYTE[4]"
  ui[5]: "REQUEST_BYTE[5]"
  ui[6]: "REQUEST_BYTE[6]"
  ui[7]: "REQUEST_BYTE[7]"

  uo[0]: "RESPONSE_BYTE[0]"
  uo[1]: "RESPONSE_BYTE[1]"
  uo[2]: "RESPONSE_BYTE[2]"
  uo[3]: "RESPONSE_BYTE[3]"
  uo[4]: "RESPONSE_BYTE[4]"
  uo[5]: "RESPONSE_BYTE[5]"
  uo[6]: "RESPONSE_BYTE[6]"
  uo[7]: "RESPONSE_BYTE[7]"

  uio[0]: "RX_VALID"
  uio[1]: "RX_READY"
  uio[2]: "TX_VALID"
  uio[3]: "TX_READY"
  uio[4]: "BUSY"
  uio[5]: "FAULT"
  uio[6]: "ABORT"
  uio[7]: "DONE_PULSE"

yaml_version: 6
